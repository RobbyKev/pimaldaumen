<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  color-scheme: light;
  --sun:#FFCC2E; --sun-deep:#F5B800; --ink:#1D1A3A; --paper:#FFFDF4; --muted:#5B5675;
  --pink:#FF5A8A; --teal:#12B3A3; --blue:#3F6BFF; --orange:#FF8A1F; --violet:#8A5CF6; --green:#4FB83D; --red:#F0463A;
  --r:18px; --bw:3px; --sh:5px 5px 0 var(--ink);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--sun); color:var(--ink);
  font:700 16px/1.45 "Nunito", system-ui, sans-serif;
  background-image:radial-gradient(rgba(29,26,58,.10) 1.5px, transparent 1.6px);
  background-size:22px 22px;
}
.wrap{max-width:720px; margin:0 auto; padding-inline:16px; padding-block:18px 40px; min-height:100%}
h1,h2,h3,.disp{font-family:"Titan One","Arial Rounded MT Bold",system-ui,sans-serif; font-weight:400; letter-spacing:.3px; text-wrap:balance; margin:0}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue); outline-offset:3px}

.card{background:var(--paper); border:var(--bw) solid var(--ink); border-radius:var(--r); box-shadow:var(--sh)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:var(--bw) solid var(--ink); border-radius:999px;
  padding:12px 22px; background:var(--paper); box-shadow:4px 4px 0 var(--ink); font-weight:900; font-size:17px; transition:transform .08s, box-shadow .08s}
.btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--pink); color:#fff}
.btn.go{background:var(--teal); color:#fff}
.btn.big{font-size:20px; padding:15px 28px; width:100%}
.btn.small{padding:7px 14px; font-size:14px; box-shadow:3px 3px 0 var(--ink)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.stack{display:flex; flex-direction:column; gap:16px}
.label{font-size:13px; text-transform:uppercase; letter-spacing:1.2px; font-weight:900; color:var(--muted)}

/* Logo */
.logo{position:relative; text-align:center; padding-block:28px 10px}
.logo .burst{display:inline-block; background:var(--pink); color:#fff; border:var(--bw) solid var(--ink); border-radius:28px;
  padding:18px 26px 14px; box-shadow:7px 7px 0 var(--ink); transform:rotate(-3deg)}
.logo h1{font-size:clamp(40px,11vw,74px); line-height:.95; -webkit-text-stroke:2px var(--ink); paint-order:stroke fill; text-shadow:3px 3px 0 var(--ink)}
.logo .tag{display:inline-block; margin-top:18px; background:var(--paper); border:var(--bw) solid var(--ink); border-radius:999px; padding:6px 16px; transform:rotate(1.5deg); font-weight:900}
.thumb{position:absolute; right:6%; top:6px; font-family:"Titan One",sans-serif; background:var(--teal); color:#fff; border:var(--bw) solid var(--ink);
  border-radius:50%; width:78px; height:78px; display:grid; place-items:center; transform:rotate(12deg); box-shadow:4px 4px 0 var(--ink); font-size:14px; line-height:1.05; text-align:center}

/* Setup */
.section{padding:18px}
.players{display:flex; flex-wrap:wrap; gap:8px}
.chip{display:inline-flex; align-items:center; gap:6px; border:2px solid var(--ink); border-radius:999px; padding:5px 8px 5px 14px; background:#fff; font-weight:800}
.chip button{border:0; background:var(--ink); color:#fff; width:22px; height:22px; border-radius:50%; font-size:13px; line-height:1; display:grid; place-items:center}
.addrow{display:flex; gap:8px}
.addrow input{flex:1; min-width:0}
.inp{border:var(--bw) solid var(--ink); border-radius:14px; padding:11px 14px; background:#fff; font-weight:800; font-size:17px}
.cats{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
.cat{position:relative; text-align:left; border:var(--bw) solid var(--ink); border-radius:16px; padding:12px 12px 12px; background:#fff; box-shadow:3px 3px 0 var(--ink);
  display:flex; flex-direction:column; gap:2px; min-height:88px; transition:transform .08s}
.cat .nm{font-family:"Titan One",sans-serif; font-size:17px; line-height:1.1}
.cat .ct{font-size:13px; color:var(--muted); font-weight:800}
.cat .dot{width:26px; height:26px; border-radius:50%; border:2px solid var(--ink); margin-bottom:6px; display:grid; place-items:center; font-size:14px; color:#fff; font-weight:900}
.cat[aria-pressed="true"]{background:var(--c); color:#fff}
.cat[aria-pressed="true"] .ct{color:rgba(255,255,255,.9)}
.cat[aria-pressed="true"] .dot{background:#fff!important; color:var(--ink)}
.seg{display:flex; flex-wrap:wrap; gap:8px}
.seg button{border:2px solid var(--ink); border-radius:999px; padding:7px 16px; background:#fff; font-weight:900}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--sun)}
.toggle{display:flex; align-items:center; gap:10px; font-weight:800}
.hint{font-size:14px; color:var(--muted); font-weight:700; margin:0}

/* Game */
.topbar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px}
.catpill{display:inline-block; border:2px solid var(--ink); border-radius:999px; padding:5px 14px; background:var(--c); color:#fff; font-weight:900; font-size:14px}
.counter{font-family:"Titan One",sans-serif; font-size:18px; font-variant-numeric:tabular-nums}
.qcard{padding:26px 22px 22px; position:relative; overflow:hidden}
.qcard::before{content:""; position:absolute; inset:0 0 auto 0; height:12px; background:var(--c); border-bottom:var(--bw) solid var(--ink)}
.qnum{font-family:"Titan One",sans-serif; font-size:15px; color:var(--muted); margin-top:4px}
.qtext{font-family:"Titan One",sans-serif; font-size:clamp(24px,5.6vw,36px); line-height:1.18; margin:10px 0 6px; text-wrap:balance}
.unit{font-weight:900; color:var(--muted)}
.reader{display:flex; align-items:center; gap:8px; font-weight:800; margin-top:14px}
.reader b{background:var(--ink); color:var(--sun); border-radius:8px; padding:2px 10px}
.est{display:grid; grid-template-columns:1fr; gap:10px}
.estrow{display:grid; grid-template-columns:minmax(80px,1fr) 1.4fr; gap:10px; align-items:center}
.estrow label{font-weight:900; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.estrow .inp{width:100%; font-variant-numeric:tabular-nums}

/* Reveal */
.answer{text-align:center; padding:24px 18px}
.answer .big{font-family:"Titan One",sans-serif; font-size:clamp(40px,12vw,76px); line-height:1; font-variant-numeric:tabular-nums; color:var(--ink);
  display:inline-block; background:var(--sun); border:var(--bw) solid var(--ink); border-radius:20px; padding:14px 22px 10px; box-shadow:var(--sh); transform:rotate(-1.5deg); animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.answer .u{display:block; font-weight:900; font-size:18px; margin-top:14px}
.info{font-weight:700; color:var(--ink); margin:14px auto 0; max-width:58ch}
@keyframes pop{from{transform:scale(.4) rotate(-8deg)} to{transform:scale(1) rotate(-1.5deg)}}
@media (prefers-reduced-motion:reduce){.answer .big{animation:none}}
.results{display:flex; flex-direction:column; gap:8px}
.res{display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:center; border:2px solid var(--ink); border-radius:14px; padding:9px 14px; background:#fff; font-variant-numeric:tabular-nums}
.res.win{background:var(--green); color:#fff}
.res .d{font-size:14px; font-weight:800; opacity:.85}
.res .v{font-weight:900}
.win-badge{font-family:"Titan One",sans-serif}
.lnk{color:var(--ink); font-weight:900}

/* Scores */
.scores{display:flex; flex-direction:column; gap:8px}
.score{display:grid; grid-template-columns:28px 1fr auto auto auto; gap:10px; align-items:center; background:#fff; border:2px solid var(--ink); border-radius:14px; padding:8px 12px; font-variant-numeric:tabular-nums}
.score .pos{font-family:"Titan One",sans-serif}
.score .pts{font-family:"Titan One",sans-serif; font-size:22px; min-width:34px; text-align:right}
.pm{border:2px solid var(--ink); background:var(--paper); border-radius:10px; width:32px; height:32px; font-weight:900}
.podium{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; align-items:end; margin-top:8px}
.pod{border:var(--bw) solid var(--ink); border-radius:16px 16px 6px 6px; text-align:center; padding:10px 6px; box-shadow:4px 4px 0 var(--ink); overflow:hidden}
.pod .n{font-weight:900; overflow-wrap:anywhere}
.pod .p{font-family:"Titan One",sans-serif; font-size:26px}

/* Modal */
.modal{position:fixed; inset:0; background:rgba(29,26,58,.55); display:grid; place-items:center; padding:16px; z-index:10}
.modal .card{width:100%; max-width:520px; max-height:88vh; overflow:auto; padding:20px}
.foot{text-align:center; font-size:13px; color:var(--ink); opacity:.7; margin-top:26px; font-weight:700}
</style>

/* ---------- State ---------- */
const KEY="pimaldaumen.v1";
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fmt=(n,yr)=>Number(n).toLocaleString("de-DE",{maximumFractionDigits:5,useGrouping:!yr});
const byKey=Object.fromEntries(CATS.map(c=>[c.k,c]));
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

let S = load() || {players:["Uli","Kevin"], usePoints:true, cats:CATS.map(c=>c.k), count:15, used:[], game:null};
let showScores=false, confirmEnd=false;

function parseNum(s){
  s=String(s).trim().replace(/[\s']/g,"");
  if(!s) return NaN;
  const c=s.includes(","), d=s.includes(".");
  if(c&&d) s=s.replace(/\./g,"").replace(",",".");
  else if(c) s=s.replace(",",".");
  else if(d && /^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  return parseFloat(s);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function startGame(){
  let pool=[];
  S.cats.forEach(k=>byKey[k].q.forEach((_,i)=>pool.push(k+":"+i)));
  let fresh=pool.filter(id=>!S.used.includes(id));
  if(fresh.length<Math.min(S.count,pool.length)){ S.used=S.used.filter(id=>!pool.includes(id)); fresh=pool; }
  const n=S.count==="all"?fresh.length:Math.min(S.count,fresh.length);
  const pts = S.usePoints && S.players.length ? S.players : [];
  S.game={queue:shuffle(fresh).slice(0,n), idx:0, phase:"q", est:{}, players:pts.map(n=>({name:n,score:0})), last:null};
  save(); render();
}
function cur(){const [k,i]=S.game.queue[S.game.idx].split(":");const c=byKey[k];const q=c.q[+i];return {c,q,id:S.game.queue[S.game.idx]}}

function reveal(){
  const g=S.game, {q,id}=cur(), a=q[1];
  const rows=g.players.map((p,i)=>{const v=parseNum(g.est[i]??"");return {i,name:p.name,v,d:isNaN(v)?Infinity:Math.abs(v-a)}});
  const valid=rows.filter(r=>isFinite(r.d));
  let winners=[];
  if(valid.length){const m=Math.min(...valid.map(r=>r.d)); winners=valid.filter(r=>Math.abs(r.d-m)<1e-9).map(r=>r.i)}
  winners.forEach(i=>g.players[i].score++);
  g.last={rows:rows.sort((x,y)=>x.d-y.d),winners};
  g.phase="r"; if(!S.used.includes(id)) S.used.push(id);
  save(); render(); window.scrollTo({top:0,behavior:"smooth"});
}
function next(){
  const g=S.game; g.idx++; g.est={}; g.last=null; g.phase = g.idx>=g.queue.length ? "end" : "q";
  save(); render(); window.scrollTo({top:0});
}
function skip(){ const {id}=cur(); if(!S.used.includes(id)) S.used.push(id); next(); }

function vGame(){
  const g=S.game, {c,q}=cur(), P=g.players, hasP=P.length>0;
  const reader = S.players.length ? S.players[g.idx % S.players.length] : null;
  const top=`<div class="topbar">
     <button class="btn small" id="home">‹ Menü</button>
     <span class="counter">${g.idx+1} / ${g.queue.length}</span>
     ${hasP?`<button class="btn small" id="scoresBtn">Punkte</button>`:`<span></span>`}
   </div>`;
  const qcard=`<article class="card qcard" style="--c:${c.c}">
     <span class="catpill" style="--c:${c.c}">${esc(c.n)}</span>
     <p class="qtext">${esc(q[0])}</p>
     ${q[2]?`<div class="unit">Antwort in: ${esc(q[2])}</div>`:`<div class="unit">Antwort: eine Jahreszahl</div>`}
     ${reader?`<div class="reader">Vorleser: <b>${esc(reader)}</b></div>`:""}
   </article>`;
  if(g.phase==="q"){
    return top+`<div class="stack">${qcard}
      ${hasP?`<section class="card section stack"><h3 style="font-size:20px">Schätzungen</h3>
        <form class="est" id="estForm">${P.map((p,i)=>`<div class="estrow"><label for="e${i}">${esc(p.name)}</label>
          <input class="inp" id="e${i}" data-i="${i}" inputmode="decimal" autocomplete="off" placeholder="${q[2]?esc(q[2]):"Jahr"}" value="${esc(g.est[i]??"")}"></div>`).join("")}</form>
        <p class="hint">Kommazahlen mit Komma, Tausender gern mit Punkt: 3,5 oder 1.200.</p></section>`:""}
      <button class="btn go big" id="reveal">Auflösen</button>
      <button class="btn small" id="skip" style="align-self:center">Frage überspringen</button>
    </div>`;
  }
  const L=g.last;
  const winNames=L.winners.map(i=>P[i].name);
  return top+`<div class="stack">
    <article class="card qcard" style="--c:${c.c}">
      <span class="catpill" style="--c:${c.c}">${esc(c.n)}</span>
      <p class="qtext" style="font-size:clamp(19px,4.4vw,24px)">${esc(q[0])}</p>
      <div class="answer"><span class="big">${fmt(q[1],!q[2])}</span><span class="u">${esc(q[2]||"")}</span>
        ${q[3]?`<p class="info">${esc(q[3])}</p>`:""}
        <p class="hint" style="margin-top:12px">Zweifel? <a class="lnk" href="https://www.google.com/search?q=${encodeURIComponent(q[0])}" target="_blank" rel="noopener">Frage googeln</a></p>
      </div>
    </article>
    ${hasP?`<section class="card section stack">
      <h3 style="font-size:22px">${winNames.length?`<span class="win-badge">Punkt für ${esc(winNames.join(" & "))}!</span>`:"Keiner hat geschätzt"}</h3>
      <div class="results">${L.rows.map(r=>`<div class="res ${L.winners.includes(r.i)?"win":""}"><span class="v">${esc(r.name)}</span>
        <span>${isNaN(r.v)?"–":fmt(r.v,!q[2])}</span><span class="d">${isFinite(r.d)?(r.d===0?"Volltreffer!":"daneben: "+fmt(+r.d.toPrecision(6))):""}</span></div>`).join("")}</div>
    </section>`:""}
    <button class="btn primary big" id="next">${g.idx+1>=g.queue.length?"Zum Ergebnis":"Nächste Frage"}</button>
  </div>`;
}

function ranking(){return [...S.game.players].map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score)}
function vScoresList(edit){
  return `<div class="scores">${ranking().map((p,k,arr)=>{const pos=arr.findIndex(x=>x.score===p.score)+1;
   return `<div class="score"><span class="pos">${pos}.</span><span style="font-weight:900">${esc(p.name)}</span>
   ${edit?`<button class="pm" data-pm="${p.i}:-1" aria-label="Punkt abziehen">−</button><button class="pm" data-pm="${p.i}:1" aria-label="Punkt dazu">+</button>`:"<span></span><span></span>"}
   <span class="pts">${p.score}</span></div>`}).join("")}</div>`;
}
function vEnd(){
  const g=S.game, has=g.players.length>0, r=has?ranking():[];
  const cols=["#C0C6D6","#FFCC2E","#E3A36B"], order=[1,0,2], h=[110,150,90];
  return `<header class="logo"><div class="burst" style="background:var(--teal)"><h1 style="font-size:clamp(34px,9vw,58px)">Geschafft!</h1></div></header>
  <div class="stack">
  ${has?`<section class="card section stack">
    <h2 style="font-size:24px;text-align:center">${esc(r[0].name)} gewinnt mit ${r[0].score} Punkt${r[0].score===1?"":"en"}</h2>
    <div class="podium">${order.map(k=>r[k]?`<div class="pod" style="background:${cols[k]};min-height:${h[k]}px"><div class="p">${r[k].score}</div><div class="n">${esc(r[k].name)}</div></div>`:`<div></div>`).join("")}</div>
    ${vScoresList(false)}</section>`:`<section class="card section"><p style="margin:0;text-align:center">${g.queue.length} Fragen gespielt. Wer war am nächsten dran?</p></section>`}
  <button class="btn primary big" id="again">Nochmal mit denselben Einstellungen</button>
  <button class="btn big" id="home2">Zum Menü</button></div>`;
}

function render(){
  let html;
  if(!S.game || S.view==="home") html=vHome();
  else if(S.game.phase==="end") html=vEnd();
  else html=vGame();
  if(showScores && S.game) html+=`<div class="modal" id="modal"><div class="card stack"><div class="row" style="justify-content:space-between"><h2 style="font-size:24px">Punktestand</h2><button class="btn small" id="closeM">Fertig</button></div>${vScoresList(true)}
    <p class="hint">Mit + und − korrigierst du Punkte von Hand.</p>
    ${confirmEnd?`<div class="row"><span style="font-weight:900">Spiel wirklich beenden?</span><button class="btn small primary" id="endYes">Ja, beenden</button><button class="btn small" id="endNo">Nein</button></div>`:`<button class="btn small" id="endGame" style="align-self:flex-start">Spiel jetzt beenden</button>`}</div></div>`;
  app.innerHTML=html;
  bind();
}

function bind(){
  const on=(sel,fn,ev="click")=>{const el=typeof sel==="string"?$(sel):sel; if(el) el.addEventListener(ev,fn)};
  on("#addForm",e=>{e.preventDefault(); const v=$("#newName").value.trim(); if(v && !S.players.includes(v)){S.players.push(v); save(); render(); $("#newName").focus();}},"submit");
  document.querySelectorAll("[data-rm]").forEach(b=>on(b,()=>{S.players.splice(+b.dataset.rm,1); save(); render()}));
  on("#usePts",e=>{S.usePoints=e.target.checked; save()},"change");
  document.querySelectorAll("[data-cat]").forEach(b=>on(b,()=>{const k=b.dataset.cat; S.cats=S.cats.includes(k)?S.cats.filter(x=>x!==k):[...S.cats,k]; save(); render()}));
  on("#allOn",()=>{S.cats=CATS.map(c=>c.k); save(); render()});
  on("#allOff",()=>{S.cats=[]; save(); render()});
  document.querySelectorAll("[data-count]").forEach(b=>on(b,()=>{const v=b.dataset.count; S.count=v==="all"?"all":+v; save(); render()}));
  on("#start",()=>{S.view="game"; startGame()});
  on("#resume",()=>{S.view="game"; render()});
  on("#resetUsed",()=>{S.used=[]; save(); render()});
  on("#home",()=>{S.view="home"; save(); render(); window.scrollTo({top:0})});
  on("#home2",()=>{S.view="home"; S.game=null; save(); render(); window.scrollTo({top:0})});
  on("#again",()=>{S.view="game"; startGame(); window.scrollTo({top:0})});
  document.querySelectorAll("#estForm input").forEach(inp=>{
    on(inp,e=>{S.game.est[inp.dataset.i]=e.target.value; save()},"input");
    on(inp,e=>{if(e.key==="Enter"){e.preventDefault(); const n=document.getElementById("e"+(+inp.dataset.i+1)); n?n.focus():reveal()}},"keydown");
  });
  on("#estForm",e=>e.preventDefault(),"submit");
  on("#reveal",reveal); on("#skip",skip); on("#next",next);
  on("#scoresBtn",()=>{showScores=true; confirmEnd=false; render()});
  on("#closeM",()=>{showScores=false; render()});
  on("#modal",e=>{if(e.target.id==="modal"){showScores=false; render()}});
  document.querySelectorAll("[data-pm]").forEach(b=>on(b,()=>{const [i,d]=b.dataset.pm.split(":").map(Number); const p=S.game.players[i]; p.score=Math.max(0,p.score+d); save(); render()}));
  on("#endGame",()=>{confirmEnd=true; render()});
  on("#endNo",()=>{confirmEnd=false; render()});
  on("#endYes",()=>{S.game.phase="end"; showScores=false; confirmEnd=false; save(); render(); window.scrollTo({top:0})});
}
if(S.game && S.game.phase!=="end") S.view="home";
render();
</script>

</body>
</html>
